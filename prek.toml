minimum_prek_version = "0.3.4"
default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt (check)"
language = "system"
entry = "cargo fmt --all -- --check"
pass_filenames = false
always_run = true
require_serial = true
priority = 10

# The CPU feature set excludes `burn-cuda` and `burn-cpu`. These both have
# heavy native build dependencies (CUDA toolkit for `burn-cuda`, prebuilt
# LLVM 20.1.4 for `burn-cpu`) that make `--all-features` impractical for a
# fast pre-commit hook. The GPU-side compile coverage and CPU-runtime
# equivalence tests live in dedicated CI jobs (`cuda-check`,
# `cpu-runtime-test`); the prek hooks only check the CPU-only feature set
# matching the GitHub Actions `test`/`clippy`/`docs` jobs.
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy (strict)"
language = "system"
entry = "cargo clippy --all-targets --features std,indicatif,mem_size,mem_dbg,proptest,rayon,burn,burn-autodiff,burn-fusion -- -D warnings"
pass_filenames = false
always_run = true
require_serial = true
priority = 20

[[repos.hooks]]
id = "cargo-test"
name = "cargo test (all targets)"
language = "system"
entry = "cargo test --all-targets --features std,indicatif,mem_size,mem_dbg,proptest,rayon,burn,burn-autodiff,burn-fusion --locked"
pass_filenames = false
always_run = true
require_serial = true
priority = 30

[[repos.hooks]]
id = "cargo-doc"
name = "cargo doc (CPU feature set, no deps)"
language = "system"
entry = "cargo doc --features std,indicatif,mem_size,mem_dbg,proptest,rayon,burn,burn-autodiff,burn-fusion --no-deps"
pass_filenames = false
always_run = true
require_serial = true
priority = 40
